<!DOCTYPE html>
<html>
<head>
  <title>Update Startup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-blue-700 p-4 text-white text-lg">
  AI-Powered Startup Ecosystem
</nav>

<!-- Update Form -->
<div class="max-w-2xl mx-auto mt-8 bg-white p-6 rounded-lg shadow">

  <h2 class="text-2xl font-bold mb-1">Update Startup Project</h2>
  <p class="text-gray-600 mb-6">
    Modify funding, team requirements, and visibility
  </p>

  <form method="POST" class="space-y-5">

    <!-- Startup Title (Read-only) -->
    <div>
      <label class="font-semibold">Startup Title</label>
      <input value="{{ startup.title }}"
             class="w-full p-2 border rounded bg-gray-100"
             disabled>
    </div>

    <!-- Domain (Read-only) -->
    <div>
      <label class="font-semibold">Domain</label>
      <input value="{{ startup.domain }}"
             class="w-full p-2 border rounded bg-gray-100"
             disabled>
    </div>

    <!-- Funding -->
    <div>
      <label class="font-semibold">Funding Required</label>
      <input name="funding"
             value="{{ startup.funding }}"
             class="w-full p-2 border rounded">
    </div>

    <!-- Team Requirements -->
    <div>
      <label class="font-semibold">Team Requirements</label>
      <input name="team"
             value="{{ startup.team }}"
             class="w-full p-2 border rounded">
    </div>

    <!-- Visibility -->
    <div>
      <label class="font-semibold">Project Visibility</label>
      <select name="visibility" class="w-full p-2 border rounded">
        <option value="Public"
          {% if startup.visibility == "Public" %}selected{% endif %}>
          Public (Visible to Investors)
        </option>

        <option value="Private"
          {% if startup.visibility == "Private" %}selected{% endif %}>
          Private
        </option>
      </select>
    </div>

    <!-- Save Button -->
    <button
      class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
      Save Changes
    </button>

  </form>
</div>

</body>
</html>
