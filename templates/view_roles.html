<!DOCTYPE html>
<html>
<head>
  <title>Open Roles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-8">
  <h2 class="text-2xl font-bold mb-4">Open Roles</h2>

  {% for r in roles %}
  <div class="bg-white p-4 mb-3 rounded shadow">
    <h3 class="text-xl font-semibold">{{ r.role_name }}</h3>
    <p class="text-sm text-gray-500">Startup: {{ r.startup_title }}</p>
    <p>Skills: {{ r.skills }}</p>

    <a href="/apply/{{ r._id }}"
       class="inline-block mt-2 bg-green-600 text-white px-4 py-1 rounded">
       Apply
    </a>
  </div>
  {% endfor %}
</div>

</body>
</html>
