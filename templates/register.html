<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | AI Startup Ecosystem</title>

<script>
tailwind.config = { darkMode: 'class' }
</script>

<script src="https://cdn.tailwindcss.com"></script>

<script>
if(localStorage.theme === "dark"){
  document.documentElement.classList.add("dark");
}

function toggleTheme(){
  document.documentElement.classList.toggle("dark");
  localStorage.theme =
    document.documentElement.classList.contains("dark")
      ? "dark" : "light";
}
</script>

</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-br from-amber-50 to-orange-100
dark:from-gray-950 dark:to-gray-900
transition duration-300">

<!-- Decorative blobs -->
<div class="absolute top-16 left-24 w-56 h-56
bg-gradient-to-br from-orange-400 to-yellow-300
rounded-full blur-3xl opacity-40"></div>

<div class="absolute bottom-20 right-32 w-44 h-44
bg-gradient-to-br from-pink-400 to-orange-300
rounded-full blur-2xl opacity-30"></div>

<!-- Register Card -->
<div class="relative w-full max-w-md rounded-xl shadow-xl p-8 z-10
bg-white dark:bg-gray-900 transition">

<!-- Theme Toggle -->
<button onclick="toggleTheme()"
class="absolute top-4 right-4
bg-gray-200 dark:bg-gray-800
px-3 py-1 rounded text-sm">
🌙
</button>

<!-- Title -->
<div class="text-center mb-6">
<h1 class="text-3xl font-bold
text-gray-800 dark:text-gray-200">
Create your account
</h1>

<p class="text-gray-500 dark:text-gray-400 mt-2">
Join the AI Startup Ecosystem
</p>
</div>

<form method="POST" class="space-y-4">

<!-- Name -->
<div>
<label class="block text-sm font-medium mb-1">
Full Name
</label>

<div class="flex items-center border rounded-lg px-3 py-2
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">

<span class="mr-2">👤</span>

<input type="text" name="name"
placeholder="Your full name"
class="w-full bg-transparent outline-none"
required>
</div>
</div>

<!-- Email -->
<div>
<label class="block text-sm font-medium mb-1">
Email Address
</label>

<div class="flex items-center border rounded-lg px-3 py-2
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">

<span class="mr-2">📧</span>

<input type="email" name="email"
placeholder="you@example.com"
class="w-full bg-transparent outline-none"
required>
</div>
</div>

<!-- Password -->
<div>
<label class="block text-sm font-medium mb-1">
Password
</label>

<div class="flex items-center border rounded-lg px-3 py-2
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">

<span class="mr-2">🔒</span>

<input type="password" name="password"
placeholder="Create a strong password"
class="w-full bg-transparent outline-none"
required>
</div>
</div>

<!-- Role -->
<div>
<label class="block text-sm font-medium mb-1">
Select Role
</label>

<select name="role"
class="w-full border rounded-lg px-3 py-2 outline-none
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700"
required>

<option value="Founder">Founder</option>
<option value="Talent">Talent</option>
<option value="Investor">Investor</option>
<option value="Admin">Admin</option>

</select>
</div>

<!-- Submit -->
<button type="submit"
class="w-full py-3 rounded-full text-white font-semibold
bg-gradient-to-r from-blue-500 to-blue-600
hover:scale-105 transition shadow-lg">

Create Account
</button>

</form>

<!-- Login Link -->
<div class="text-center mt-6 text-sm">
<a href="/login"
class="text-blue-600 dark:text-blue-400 hover:underline">

Already have an account?
</a>
</div>

</div>

</body>
</html>
