<!DOCTYPE html>
<html>
<head>
  <title>Browse Startups</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-8">
  <h2 class="text-2xl font-bold mb-4">Available Startups</h2>

  {% for s in startups %}
  <div class="bg-white p-4 mb-3 rounded shadow">
    <h3 class="text-xl font-semibold">{{ s.title }}</h3>
    <p>{{ s.description }}</p>

    <a href="/fund/{{ s._id }}"
       class="inline-block mt-2 bg-blue-600 text-white px-4 py-1 rounded">
       Fund Startup
    </a>
  </div>
  {% endfor %}
</div>

</body>
</html>
