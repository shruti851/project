<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | AI Startup Ecosystem</title>

<script>
tailwind.config = { darkMode: 'class' }
</script>

<script src="https://cdn.tailwindcss.com"></script>

<script>
function toggleDark(){
  document.documentElement.classList.toggle("dark");
}
</script>

</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-br from-amber-50 to-orange-100
dark:from-gray-900 dark:to-black
transition-colors duration-300">

<!-- Toggle -->
<button onclick="toggleDark()"
class="absolute top-6 right-6 px-3 py-1 rounded
bg-gray-800 text-white
dark:bg-yellow-400 dark:text-black">
🌙
</button>

<!-- Decorative blobs -->
<div class="absolute top-20 right-32 w-64 h-64
bg-gradient-to-br from-orange-400 to-yellow-300
dark:from-purple-700 dark:to-indigo-700
rounded-full blur-3xl opacity-40"></div>

<div class="absolute bottom-24 left-24 w-40 h-40
bg-gradient-to-br from-orange-300 to-pink-400
dark:from-blue-700 dark:to-purple-700
rounded-full blur-2xl opacity-30"></div>

<!-- Login Card -->
<div class="relative
bg-white dark:bg-gray-800
w-full max-w-md rounded-xl shadow-xl p-8 z-10
transition-colors">

<!-- Title -->
<div class="text-center mb-6">
<h1 class="text-3xl font-bold text-gray-800 dark:text-white">
Good to see you again
</h1>
<p class="text-gray-500 dark:text-gray-400 mt-2">
AI-Powered Startup Ecosystem
</p>
</div>

<!-- Form -->
<form method="POST" class="space-y-4">

<div>
<label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">
Your email
</label>
<div class="flex items-center border rounded-lg px-3 py-2
bg-white dark:bg-gray-700">
<span class="text-gray-400 mr-2">👤</span>
<input type="email" name="email"
class="w-full outline-none bg-transparent text-gray-800 dark:text-white"
required>
</div>
</div>

<div>
<label class="block text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">
Your password
</label>
<div class="flex items-center border rounded-lg px-3 py-2
bg-white dark:bg-gray-700">
<span class="text-gray-400 mr-2">🔒</span>
<input type="password" name="password"
class="w-full outline-none bg-transparent text-gray-800 dark:text-white"
required>
</div>
</div>

<button type="submit"
class="w-full py-3 rounded-full text-white font-semibold
bg-gradient-to-r from-green-500 to-green-600
hover:scale-105 transition-transform shadow-lg">
Sign in
</button>

</form>

<!-- Links -->
<div class="flex justify-between mt-6 text-sm">
<a href="/register"
class="text-blue-600 dark:text-blue-400 hover:underline">
Don’t have an account?
</a>

<a href="#"
class="text-blue-600 dark:text-blue-400 hover:underline">
Forgot password?
</a>
</div>

</div>

</body>
</html>
