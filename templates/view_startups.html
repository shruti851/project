<!DOCTYPE html>
<html>
<head>
  <title>My Startups</title>
  <script>
  tailwind.config = {
    darkMode: 'class'
  }
</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<nav class="bg-blue-700 p-4 text-white text-lg">
  AI-Powered Startup Ecosystem
</nav>

<div class="max-w-6xl mx-auto mt-8">

  <h2 class="text-2xl font-bold mb-4">My Startup Projects</h2>

  <div class="grid md:grid-cols-2 gap-5">

    {% for s in startups %}
    <div class="bg-white p-5 rounded shadow">

      <div class="flex justify-between items-center">
        <h3 class="text-xl font-semibold">{{ s.title }}</h3>
        <span class="text-sm px-3 py-1 rounded
          {% if s.visibility == 'Public' %}
            bg-green-100 text-green-700
          {% else %}
            bg-gray-200 text-gray-700
          {% endif %}
        ">
          {{ s.visibility }}
        </span>
      </div>

      <p class="text-gray-600 mt-1">{{ s.domain }}</p>

      <div class="mt-3 text-sm space-y-1">
        <p><b>Funding:</b> {{ s.funding }}</p>
        <p><b>Team:</b> {{ s.team }}</p>
      </div>

      <div class="mt-4 flex justify-between">
        <a href="/update-startup/{{ s._id }}"
           class="text-blue-600 font-semibold">
          Update Project
        </a>

        <span class="text-sm text-gray-500">
          Created by You
        </span>
      </div>

    </div>
    {% endfor %}

  </div>
</div>

</body>
</html>
