<!DOCTYPE html>
<html>
<head>
<title>Pitch Startup</title>

<script>
tailwind.config = { darkMode: 'class' }
</script>

<script src="https://cdn.tailwindcss.com"></script>

<script>
function toggleDark(){
  document.documentElement.classList.toggle("dark");
}
</script>

</head>

<body class="min-h-screen transition duration-300
bg-gray-100 dark:bg-gray-950">

<!-- NAVBAR -->
<nav class="bg-blue-700 text-white p-4 flex justify-between items-center">
  <span class="font-semibold text-lg">
    🚀 AI-Powered Startup Ecosystem
  </span>

  <button onclick="toggleDark()"
    class="bg-white text-black px-3 py-1 rounded
    dark:bg-gray-800 dark:text-white">
    🌙
  </button>
</nav>

<!-- FORM CARD -->
<div class="max-w-3xl mx-auto mt-10
bg-white dark:bg-gray-900
p-8 rounded-xl shadow-lg transition">

<h2 class="text-3xl font-bold mb-1
text-gray-800 dark:text-gray-200">
Pitch Your Startup Idea
</h2>

<p class="mb-6 text-gray-600 dark:text-gray-400">
Share your vision with investors and talent
</p>

<form method="POST" enctype="multipart/form-data" class="space-y-5">

<div>
<label class="font-semibold">Startup Title</label>
<input name="title"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700"
required>
</div>

<div class="grid grid-cols-2 gap-4">

<div>
<label class="font-semibold">Domain</label>
<input name="domain"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">
</div>

<div>
<label class="font-semibold">Funding Required</label>
<input name="funding"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">
</div>

</div>

<div>
<label class="font-semibold">Problem & Solution</label>
<textarea name="description" rows="4"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700"></textarea>
</div>

<div>
<label class="font-semibold">Team Requirements</label>
<input name="team"
placeholder="Frontend, Backend, AI Engineer"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">
</div>

<div>
<label class="font-semibold">Project Visibility</label>
<select name="visibility"
class="w-full p-2 border rounded
bg-gray-50 dark:bg-gray-800
border-gray-300 dark:border-gray-700">

<option value="Public">
Public (Visible to Investors)
</option>

<option value="Private">
Private
</option>

</select>
</div>

<div>
<label class="font-semibold">Upload Documents</label>
<input type="file" name="documents" multiple
class="mt-2 text-sm text-gray-600 dark:text-gray-400">
<p class="text-sm text-gray-500 dark:text-gray-400">
Pitch deck, business model, problem statement
</p>
</div>

<button
class="w-full bg-blue-600 text-white py-2 rounded
hover:bg-blue-700 transition">
Submit Startup Idea
</button>

</form>

</div>

</body>
</html>
