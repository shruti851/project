<!DOCTYPE html>
<html>
<head>
  <title>AI Skill Matching</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">

<h2 class="text-3xl font-bold mb-6 text-gray-800">
  🤖 AI Skill Matching
</h2>

<p class="text-gray-600 mb-8">
  Based on your skills, we recommend the following roles
</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  {% for role in roles %}
  <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
    <h3 class="text-xl font-semibold">{{ role.title }}</h3>
    <p class="text-gray-500 mt-2">{{ role.description }}</p>

    <p class="mt-3 text-sm text-blue-600">
      Required Skills: {{ role.skills }}
    </p>

    <a href="/roles" class="inline-block mt-4 text-green-600 font-semibold">
      Apply →
    </a>
  </div>
  {% endfor %}

</div>

</body>
</html>
