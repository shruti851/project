<!DOCTYPE html>
<html>
<head>
  <title>Market Insights</title>
  <script>
  tailwind.config = {
    darkMode: 'class'
  }
</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h2 class="text-3xl font-bold mb-6">📊 Market Insights</h2>

<div class="bg-white p-6 rounded shadow">
  <h3 class="text-xl font-semibold mb-4">Popular Startup Domains</h3>

  {% for item in stats %}
  <div class="flex justify-between border-b py-2">
    <span>{{ item._id }}</span>
    <span class="font-bold">{{ item.count }}</span>
  </div>
  {% else %}
  <p>No data available.</p>
  {% endfor %}
</div>

</body>
</html>
