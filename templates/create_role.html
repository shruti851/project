<!DOCTYPE html>
<html>
<head>
  <title>Create Role</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-center">Create Open Role</h2>

  <form method="POST">
    <input name="startup_title" placeholder="Startup Title" class="w-full p-2 mb-3 border rounded" required>
    <input name="role_name" placeholder="Role Name" class="w-full p-2 mb-3 border rounded" required>
    <input name="skills" placeholder="Required Skills" class="w-full p-2 mb-3 border rounded" required>
    <textarea name="description" placeholder="Role Description" class="w-full p-2 mb-4 border rounded"></textarea>

    <button class="bg-blue-600 text-white w-full p-2 rounded">Create Role</button>
  </form>
</div>

</body>
</html>
