<!DOCTYPE html>
<html>
<head>
  <title>Fund Startup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">
    Fund {{ startup.title }}
  </h2>

  <form method="POST">
    <input name="investor_name" placeholder="Investor Name"
           class="w-full p-2 mb-3 border rounded" required>

    <input name="amount" placeholder="Funding Amount"
           class="w-full p-2 mb-3 border rounded" required>

    <input name="equity" placeholder="Equity (%)"
           class="w-full p-2 mb-4 border rounded" required>

    <button class="bg-green-600 text-white w-full p-2 rounded">
      Submit Offer
    </button>
  </form>
</div>

</body>
</html>
